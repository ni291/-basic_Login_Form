<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Login Form</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            margin:0;
            padding:0;
            font-family: Arial,sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box{
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;

        }
        .login-box h2{
            margin-bottom: 20px;
            text-align: center;
            color: #333;

        }

        .user_data{
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .btn{
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            border: none;
            border-radius: 5px;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;

        }

        .btn:hover{
            background-color:#170cf3;

        }

    </style>
</head>
<body style="background-color:rgb(215, 226, 250);">
    <div class="login-box">
    <h1>Login</h1>
    <form>
        <input type="text" class="user_data" placeholder="Username" required />
        <input type="password" class="user_data" placeholder="password" required />

        <button class="btn">Login</button>
        
        </form>
    </div>
</body>
</html>
